<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Animal Picture</title>
        <link rel="stylesheet" href="styles.css" />
        <script src="app.js" defer></script>
    </head>
    <body>
        <header class="site-header">
            <h1 class="site-title">Welcome to the Interactive Reveal What's That Aninal UI</h1>
            <p class="site-subtitle">Click on the butttons below to reveal the animal images.</p>
        </header>
        <main>
            <div id="animal-card-container" class="animal-card-container">
            </div>
            <div class="buttons-container">
                <button type="button" id="button-dog" class="button">Reveal a DOG</button>
                <button type="button" id="button-cat" class="button">Reveal a CAT</button>
                <button type="button" id="button-cow" class="button">Reveal a COW</button>
            </div>
        </main>
    </body>
</html>
